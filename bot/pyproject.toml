[project]
name = "paperlessbox-bot"
version = "0.1.0"
description = "Telegram bot for PaperlessBox (aiogram)"
requires-python = ">=3.12"
dependencies = [
    "paperlessbox-shared",
    "aiogram>=3.7",
    "celery>=5.4",
    "redis>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
