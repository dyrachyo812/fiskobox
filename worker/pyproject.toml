[project]
name = "paperlessbox-worker"
version = "0.1.0"
description = "Celery worker: OpenCV preprocessing + OCR + parsing for PaperlessBox"
requires-python = ">=3.12"
dependencies = [
    "paperlessbox-shared",
    "celery>=5.4",
    "redis>=5.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
    "Pillow>=10.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "aiogram>=3.7",
    "google-cloud-vision>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../shared/src"]
testpaths = ["tests"]
python_files = ["*tests.py", "*Tests.py"]
markers = [
    "local_llm: real requests to local Ollama (manual run)",
]
