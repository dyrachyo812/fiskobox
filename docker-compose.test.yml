# Тестовый стек: поднимается только на время integration-тестов и сносится с томами.
# Запуск вручную:
#   docker compose -f docker-compose.test.yml up -d --wait
#   docker compose -f docker-compose.test.yml down -v
#
# Автоматически поднимается из tests/conftest.py (если доступен Docker).

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paperless_test
      POSTGRES_PASSWORD: paperless_test
      POSTGRES_DB: paperlessbox_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless_test -d paperlessbox_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
