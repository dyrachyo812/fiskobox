name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: backend-lint-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paperless_test
          POSTGRES_PASSWORD: paperless_test
          POSTGRES_DB: paperlessbox_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U paperless_test -d paperlessbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://paperless_test:paperless_test@127.0.0.1:5433/paperlessbox_test
      TEST_REDIS_URL: redis://127.0.0.1:6380/0
      COVERAGE_FILE: /tmp/fiskobox.coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ./shared
          pip install -e "./backend[dev]"
          pip install -e "./worker[dev]"
          pip install -e ./bot
          pip install ruff

      - name: Ruff
        run: ruff check backend worker bot shared tests

      - name: Pytest
        run: >
          pytest
          --cov=backend
          --cov=worker
          --cov=shared
          --cov-report=term
          -m "not local_llm"

  frontend-lint-test:
    name: frontend-lint-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test

  docker-build-check:
    name: docker-build-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build
