[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests backend/tests worker/tests
python_files = *tests.py *Tests.py
pythonpath =
    backend/src
    worker/src
    shared/src
    .
markers =
    local_llm: real requests to local Ollama (manual run)
addopts = -m "not local_llm"
filterwarnings =
    ignore::DeprecationWarning
